site_name: DevLoop
site_url: https://shaifulshabuj.github.io/devloop
site_description: Multi-agent AI development pipeline — remote-controllable, self-healing, provider-flexible
site_author: shaifulshabuj

repo_name: shaifulshabuj/devloop
repo_url: https://github.com/shaifulshabuj/devloop
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

plugins:
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
  - mike:
      alias_type: symlink
      version_selector: true

extra:
  version:
    provider: mike
    default: stable
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shaifulshabuj/devloop
  generator: false

not_in_nav: |
  /session-history/**

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
    - First Project: getting-started/first-project.md
  - Concepts:
    - concepts/index.md
    - Pipeline: concepts/pipeline.md
    - Providers & Failover: concepts/providers.md
    - Worker Modes: concepts/worker-modes.md
    - Permissions: concepts/permissions.md
    - Fix Escalation: concepts/fix-escalation.md
  - Reference:
    - reference/index.md
    - Commands: reference/commands.md
    - Configuration: reference/configuration.md
    - Events Stream: reference/events.md
    - Sessions Layout: reference/sessions.md
  - TUI:
    - tui/index.md
    - Dashboard: tui/dashboard.md
    - Focus Mode: tui/focus.md
    - Command Palette: tui/palette.md
  - Changelog: changelog.md
