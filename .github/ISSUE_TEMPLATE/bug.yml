name: Bug
description: Something is broken or behaves incorrectly
title: "[bug] "
labels: ["type/bug"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: Symptom
      description: What you see
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: devloop version
      placeholder: "v5.2.0"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
    validations:
      required: false
